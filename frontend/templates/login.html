{% extends "base.html" %}
{% block titulo %}Iniciar sesión | C.H.A.O.{% endblock %}

{% block contenido %}
<section class="login">
    <h2>Iniciar sesión</h2>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <label for="correo">Correo institucional</label>
        <input type="email" id="correo" name="correo" placeholder="e1310000011@live.uleam.edu.ec" required>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <button type="submit">Ingresar</button>
    </form>
</section>
{% endblock %}
